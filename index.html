<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101627">
<meta name="robots" content="noindex">
<title>Find your table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Benin regalia: indigo cloth, coral beads, cast brass, ivory lace */
    --indigo:#101627;
    --indigo-2:#182137;
    --indigo-3:#1F2B45;
    --coral:#D9553B;
    --brass:#C9A063;
    --brass-soft:#8E7342;
    --ivory:#F3ECDD;
    --muted:#8D93A8;
    --hair:rgba(243,236,221,.12);

    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}

  body{
    min-height:100vh;min-height:100dvh;
    background:var(--indigo);
    color:var(--ivory);
    font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }

  /* warm glow behind the masthead, nothing more */
  body::before{
    content:"";position:fixed;top:-30vh;left:50%;transform:translateX(-50%);
    width:130vw;height:70vh;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 50% 40%,rgba(217,85,59,.16),transparent 62%);
  }

  .sheet{position:relative;z-index:1;max-width:33rem;margin:0 auto;
    padding:0 1.35rem 3.5rem;padding-top:max(2.5rem,env(safe-area-inset-top))}

  /* ---------- bead strand: the one motif ---------- */
  .beads{display:flex;align-items:center;gap:.42rem;height:1rem}
  .beads i{display:block;border-radius:50%;background:var(--coral);flex:none}
  .beads i:nth-child(3n){background:var(--brass)}
  .beads i:nth-child(4n){background:var(--brass-soft)}

  /* ---------- masthead ---------- */
  .eyebrow{font-size:.66rem;font-weight:600;letter-spacing:.26em;text-transform:uppercase;
    color:var(--coral);margin:1.6rem 0 1.1rem}

  h1{font-family:var(--display);font-weight:600;
    font-size:clamp(2.5rem,12vw,3.9rem);line-height:.96;letter-spacing:-.02em;
    margin:0}
  h1 em{display:block;font-style:normal;color:var(--brass)}

  .sub{color:var(--muted);font-size:.98rem;line-height:1.55;margin:1.15rem 0 2.1rem;max-width:24rem}

  /* ---------- search ---------- */
  .field{position:relative;display:flex;align-items:center}
  .field svg{position:absolute;left:1.05rem;width:1.15rem;height:1.15rem;
    stroke:var(--brass-soft);fill:none;stroke-width:1.7;pointer-events:none}

  #q{width:100%;font-family:var(--ui);font-size:1.12rem;color:var(--ivory);
    background:var(--indigo-2);border:1px solid var(--hair);border-radius:.85rem;
    padding:1.1rem 1rem 1.1rem 2.95rem;outline:none;
    transition:border-color .2s,box-shadow .2s,background .2s;
    -webkit-appearance:none;appearance:none}
  #q::placeholder{color:#5F6579}
  #q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  #q:focus-visible{border-color:var(--brass);background:var(--indigo-3);
    box-shadow:0 0 0 3px rgba(201,160,99,.2)}

  .clear{position:absolute;right:.6rem;width:2.1rem;height:2.1rem;border:0;
    background:none;color:var(--muted);font-size:1.35rem;line-height:1;cursor:pointer;
    border-radius:50%;display:none}
  .clear.on{display:block}
  .clear:hover{color:var(--ivory)}
  .clear:focus-visible{outline:2px solid var(--brass);outline-offset:1px}

  /* ---------- results ---------- */
  #results{list-style:none;margin:1.4rem 0 0;padding:0}
  #results li{border-top:1px solid var(--hair);animation:slip .28s ease both}
  #results li:last-child{border-bottom:1px solid var(--hair)}
  #results li:nth-child(1){animation-delay:.01s}
  #results li:nth-child(2){animation-delay:.04s}
  #results li:nth-child(3){animation-delay:.07s}
  #results li:nth-child(4){animation-delay:.10s}
  #results li:nth-child(5){animation-delay:.13s}
  @keyframes slip{from{opacity:0;transform:translateY(-.3rem)}to{opacity:1;transform:none}}

  .row{width:100%;display:flex;align-items:center;gap:.9rem;background:none;border:0;
    color:inherit;font:inherit;text-align:left;padding:1.18rem .3rem;cursor:pointer;
    transition:padding-left .18s}
  .row:hover,.row:focus-visible{padding-left:.75rem}
  .row:hover .rname,.row:focus-visible .rname{color:var(--brass)}
  .row:focus-visible{outline:2px solid var(--brass);outline-offset:-3px;border-radius:.5rem}
  .rname{flex:1;font-size:1.08rem;line-height:1.35;transition:color .18s}
  .arrow{flex:none;color:var(--brass-soft);font-size:1.05rem}

  .note{color:var(--muted);font-size:.95rem;line-height:1.6;margin:1.5rem 0 0}
  .note b{color:var(--ivory);font-weight:600}

  .foot{display:flex;align-items:center;gap:.7rem;margin-top:3rem;
    color:#5F6579;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase}
  .foot .line{flex:1;height:1px;background:var(--hair)}

  /* ---------- the place card ---------- */
  #answer{position:fixed;inset:0;z-index:20;background:var(--indigo);
    display:flex;overflow-y:auto;
    padding:1.6rem 1.35rem max(1.6rem,env(safe-area-inset-bottom))}
  #answer[hidden]{display:none}
  #answer::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,rgba(201,160,99,.15),transparent 60%)}

  .card{position:relative;margin:auto;width:100%;max-width:24rem;text-align:center;
    border:1px solid rgba(201,160,99,.32);border-radius:1.1rem;
    background:linear-gradient(180deg,var(--indigo-2),var(--indigo));
    padding:2.5rem 1.5rem 2.1rem;
    animation:card .5s cubic-bezier(.16,.84,.24,1) both}
  @keyframes card{from{opacity:0;transform:translateY(1.1rem) scale(.97)}to{opacity:1;transform:none}}

  .card .beads{justify-content:center}
  .card .who{font-family:var(--display);font-weight:600;
    font-size:clamp(1.35rem,6.2vw,1.7rem);line-height:1.2;
    margin:1.5rem 0 0}
  .card .rule{width:2.6rem;height:1px;background:var(--brass-soft);margin:1.15rem auto}
  .card .label{font-size:.66rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
    color:var(--coral);margin:0}
  .card .num{font-family:var(--display);font-weight:600;
    font-size:clamp(3.1rem,17vw,4rem);line-height:1;color:var(--brass);
    margin:0;letter-spacing:-.035em;
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    animation:num .55s .12s cubic-bezier(.16,.84,.24,1) both}
  @keyframes num{from{opacity:0;transform:translateY(.28em)}to{opacity:1;transform:none}}

  /* the table itself, seen from above: one seat per guest, yours in coral */
  .viz{position:relative;width:clamp(11.5rem,58vw,13rem);aspect-ratio:1;margin:.85rem auto 0}
  .viz svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .viz .ring{fill:none;stroke:rgba(201,160,99,.38);stroke-width:1.4}
  .viz .ring2{fill:none;stroke:rgba(201,160,99,.13);stroke-width:1}
  .viz .seat{fill:var(--brass);transform-box:fill-box;transform-origin:center;
    animation:seat .5s cubic-bezier(.16,.84,.24,1) both}
  .viz .seat.you{fill:var(--coral)}
  .viz .halo{fill:none;stroke:rgba(217,85,59,.45);stroke-width:1.4;
    transform-box:fill-box;transform-origin:center;
    animation:seat .5s cubic-bezier(.16,.84,.24,1) both}
  @keyframes seat{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}

  .mates{list-style:none;margin:.4rem 0 0;padding:0;
    font-size:.96rem;line-height:1.45;color:var(--ivory)}
  .mates li{padding:.26rem 0}

  .card .tail{margin-top:1.6rem}

  .back{margin-top:1.9rem;background:none;border:1px solid var(--hair);border-radius:99px;
    color:var(--muted);font:inherit;font-size:.92rem;padding:.72rem 1.5rem;cursor:pointer;
    transition:color .18s,border-color .18s}
  .back:hover,.back:focus-visible{color:var(--ivory);border-color:var(--brass)}
  .back:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  .enter{animation:enter .55s cubic-bezier(.16,.84,.24,1) both}
  .d1{animation-delay:.02s} .d2{animation-delay:.10s}
  .d3{animation-delay:.18s} .d4{animation-delay:.26s}
  @keyframes enter{from{opacity:0;transform:translateY(.7rem)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>

<main class="sheet" id="sheet">
  <div class="beads enter d1" aria-hidden="true">
    <i style="width:9px;height:9px"></i><i style="width:6px;height:6px"></i>

/* The small line above the heading: */
const EVENT_LINE = 'September 2026';

/* ============================================================ */
document.getElementById('event-line').textContent = EVENT_LINE;

// Titles are stripped on BOTH sides, so typing "Mrs" alone matches nobody
// but "Mrs Iyere" still finds her.
const TITLES = new Set(['mr','mrs','ms','miss','dr']);

function norm(s){
  const base = (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
  if (!base) return '';
  return base.split(' ').filter(w => !TITLES.has(w)).join(' ');
}

const people = GUESTS.split('\n')
  .map(l => l.trim())
  .filter(l => l && !l.startsWith('#'))
  .map(l => {
    const i = l.lastIndexOf(',');
    if (i === -1) return null;
    const name = l.slice(0,i).trim(), table = l.slice(i+1).trim();
    return (name && table) ? { name, table, key: norm(name) } : null;
  })
  .filter(Boolean);

const CAP = 10;

function search(raw){
  const q = norm(raw);
  if (q.length < 2) return { hits:[], total:0 };
  const scored = people
    .map(p => {
      const words = p.key.split(' ');
      let rank = -1;
      if (p.key === q) rank = 0;
      else if (p.key.startsWith(q)) rank = 1;
      else if (words.some(w => w.startsWith(q))) rank = 2;
      else if (p.key.includes(q)) rank = 3;
      return { p, rank };
    })
    .filter(m => m.rank > -1)
    .sort((a,b) => a.rank - b.rank || a.p.name.localeCompare(b.p.name));
  return { hits: scored.slice(0,CAP).map(m => m.p), total: scored.length };
}

const input   = document.getElementById('q');
const results = document.getElementById('results');
const note    = document.getElementById('note');
const answer  = document.getElementById('answer');
const clearBt = document.getElementById('clear');
const stat    = document.getElementById('stat');
const sheet   = document.getElementById('sheet');

const tables = new Set(people.map(p => p.table));
stat.textContent = people.length + ' guests \u00b7 ' + tables.size + ' tables';

let shown = [];

function render(){
  const raw = input.value;
  const { hits, total } = search(raw);
  shown = hits;

  clearBt.classList.toggle('on', raw.length > 0);
  results.innerHTML = '';

  for (const p of hits){
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'row';
    const n = document.createElement('span');
    n.className = 'rname';
    n.textContent = p.name;
    const a = document.createElement('span');
    a.className = 'arrow';
    a.setAttribute('aria-hidden','true');
    a.textContent = '\u2192';
    btn.append(n, a);
    btn.addEventListener('click', () => show(p));
    li.appendChild(btn);
    results.appendChild(li);
  }

  if (norm(raw).length < 2){
    note.textContent = '';
  } else if (!hits.length){
    note.innerHTML = 'No match for <b></b>. Try just your surname, or ask at the door.';
    note.querySelector('b').textContent = raw.trim();
  } else if (total > CAP){
    note.textContent = 'Showing the first ' + CAP + ' of ' + total + ' matches \u2014 add more of your name to narrow it down.';
  } else {
    note.textContent = '';
  }
}

const card = answer.querySelector('.card');

function show(p){
  document.getElementById('a-who').textContent = p.name;
  document.getElementById('a-num').textContent = p.table;

  // everyone at this table, in list order; you get the coral seat
  const party = people.filter(x => x.table === p.table);
  const NS = 'http://www.w3.org/2000/svg';
  const viz = document.getElementById('a-viz');
  viz.innerHTML = '';
  const ring = (r, cls) => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', 100); c.setAttribute('cy', 100); c.setAttribute('r', r);
    c.setAttribute('class', cls);
    viz.appendChild(c);
  };
  ring(78, 'ring'); ring(63, 'ring2');
  party.forEach((m, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / party.length;
    const x = (100 + 78 * Math.cos(a)).toFixed(2);
    const y = (100 + 78 * Math.sin(a)).toFixed(2);
    const delay = (.18 + i * .05).toFixed(2) + 's';
    if (m === p){
      const h = document.createElementNS(NS, 'circle');
      h.setAttribute('cx', x); h.setAttribute('cy', y); h.setAttribute('r', 11.5);
      h.setAttribute('class', 'halo');
      h.style.animationDelay = delay;
      viz.appendChild(h);
    }
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y);
    c.setAttribute('r', m === p ? 7 : 5.5);
    c.setAttribute('class', m === p ? 'seat you' : 'seat');
    c.style.animationDelay = delay;
    viz.appendChild(c);
  });

  const list = document.getElementById('a-mates');
  list.innerHTML = '';
  for (const m of party){
    if (m === p) continue;
    const li = document.createElement('li');
    li.textContent = m.name;
    list.appendChild(li);
  }
  const alone = party.length < 2;
  document.getElementById('a-rule2').hidden = alone;
  document.getElementById('a-mates-label').hidden = alone;
  list.hidden = alone;

  answer.hidden = false;
  answer.scrollTop = 0;
  // restart the reveal so it plays on every lookup, not just the first
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
  // 3. keep focus and screen readers out of the page behind the card
  sheet.inert = true;
  // keep the tall card at its top on open — focus must not yank the view to the button
  document.getElementById('a-back').focus({preventScroll: true});
}

function close(){
  answer.hidden = true;
  sheet.inert = false;
  input.focus();
  input.select();
}

document.getElementById('a-back').addEventListener('click', close);

input.addEventListener('input', render);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && shown.length === 1){ e.preventDefault(); show(shown[0]); }
});

clearBt.addEventListener('click', () => {
  input.value = '';
  render();
  input.focus();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !answer.hidden) close();
});

render();
</script>
</body>
</html>
